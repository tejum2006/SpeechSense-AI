<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161D31" />
      <stop offset="50%" stop-color="#0F1424" />
      <stop offset="100%" stop-color="#080B13" />
    </linearGradient>
    
    <!-- Dynamic Glowing Border -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.75" />
    </linearGradient>
    
    <!-- Soundwave & Emotion Spectrum Gradients -->
    <linearGradient id="wave1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="wave3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="wave4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="wave5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="wave6" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="wave7" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080B13" stop-opacity="0" />
    </radialGradient>
    
    <!-- Resonance Trajectory Gradient -->
    <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1.0" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Premium Squircle Base Frame -->
  <rect x="18" y="18" width="476" height="476" rx="115" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="4.5" />
  
  <!-- Subtle Internal Radial Glow -->
  <circle cx="256" cy="256" r="195" fill="url(#coreGlow)" />

  <!-- Outer Acoustic Resonance Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1.5" />

  <!-- 7 Acoustic Soundwave / Vocal Emotion Spectrum Bars -->
  <!-- Bar 1 (Leftmost - Cyan) -->
  <rect x="136" y="210" width="20" height="92" rx="10" fill="url(#wave1)" opacity="0.9" />
  <!-- Bar 2 (Sky Blue) -->
  <rect x="176" y="165" width="20" height="182" rx="10" fill="url(#wave2)" opacity="0.92" />
  <!-- Bar 3 (Indigo) -->
  <rect x="216" y="125" width="20" height="262" rx="10" fill="url(#wave3)" opacity="0.95" />
  <!-- Bar 4 (Center Zenith - Violet) -->
  <rect x="256" y="95" width="20" height="322" rx="10" fill="url(#wave4)" filter="url(#glowFilter)" />
  <!-- Bar 5 (Magenta Rose) -->
  <rect x="296" y="135" width="20" height="242" rx="10" fill="url(#wave5)" opacity="0.95" />
  <!-- Bar 6 (Tangerine) -->
  <rect x="336" y="175" width="20" height="162" rx="10" fill="url(#wave6)" opacity="0.92" />
  <!-- Bar 7 (Rightmost - Sun Gold) -->
  <rect x="376" y="220" width="20" height="72" rx="10" fill="url(#wave7)" opacity="0.9" />

  <!-- Harmonic Resonance Crest Curve (Neural Pulse Trajectory) -->
  <path d="M 100 256 C 146 220, 180 300, 226 210 C 246 170, 266 170, 286 210 C 332 300, 366 220, 412 256" 
        fill="none" stroke="url(#arcGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />

  <!-- Focal Intelligence Nodes -->
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" filter="url(#glowFilter)" />
  <circle cx="226" cy="210" r="4.5" fill="#38BDF8" />
  <circle cx="286" cy="210" r="4.5" fill="#F472B6" />
</svg>

